name: Deploy to an Auto Scaling group
description: >
  Replaces every server in an Auto Scaling group (instance refresh). New servers configure
  themselves with Ansible on boot. Then runs the smoke tests against the load balancer.

inputs:
  role-arn:
    description: IAM role GitHub assumes through OIDC
    required: true
  region:
    description: AWS region
    required: true
  asg-name:
    description: Auto Scaling group name
    required: true
  alb-name:
    description: Application Load Balancer name
    required: true

runs:
  using: composite
  steps:
    - name: Log in to AWS (OIDC, no stored keys)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: ${{ inputs.region }}

    - name: Start a rolling instance refresh
      id: refresh
      shell: bash
      run: |
        set -euo pipefail
        id=$(aws autoscaling start-instance-refresh \
          --auto-scaling-group-name "${{ inputs.asg-name }}" \
          --preferences '{"MinHealthyPercentage":50,"InstanceWarmup":120}' \
          --query InstanceRefreshId --output text)
        echo "id=$id" >> "$GITHUB_OUTPUT"
        echo "Started instance refresh $id"

    - name: Wait for the rollout to finish
      shell: bash
      run: |
        set -euo pipefail
        for i in $(seq 1 120); do
          status=$(aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name "${{ inputs.asg-name }}" \
            --instance-refresh-ids "${{ steps.refresh.outputs.id }}" \
            --query 'InstanceRefreshes[0].Status' --output text)
          echo "[$i/120] Instance refresh status: $status"
          case "$status" in
            Successful) exit 0 ;;
            Failed|Cancelled|Cancelling|RollbackInProgress|RollbackFailed|RollbackSuccessful)
              echo "::error::Instance refresh ended with status $status"; exit 1 ;;
          esac
          sleep 30
        done
        echo "::error::Timed out waiting for the instance refresh"; exit 1

    - name: Smoke tests against the load balancer
      shell: bash
      run: |
        set -euo pipefail
        dns=$(aws elbv2 describe-load-balancers --names "${{ inputs.alb-name }}" \
          --query 'LoadBalancers[0].DNSName' --output text)
        echo "Testing http://$dns"
        bash tests/smoke.sh "http://$dns"
