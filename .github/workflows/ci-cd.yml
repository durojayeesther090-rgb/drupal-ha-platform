name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Never run two deployments at the same time
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  AWS_REGION: eu-west-1

jobs:
  # ---------------------------------------------------------------- 1. Static checks
  validate:
    name: Validate code and configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Terraform format (warning only)
        run: terraform fmt -check -recursive -diff terraform
        continue-on-error: true

      - name: Terraform validate
        run: |
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

      - name: Ansible syntax check
        run: |
          pip install ansible-core
          cd ansible
          ansible-playbook --syntax-check -i localhost, site.yml \
            -e "aws_region=eu-west-1 db_secret_arn=x efs_id=fs-1 log_prefix=/drupal-ha/staging"
          ansible-playbook --syntax-check -i localhost, monitoring.yml \
            -e "aws_region=eu-west-1 db_secret_arn=x"

      - name: Check monitoring files (alert rules and dashboards)
        run: |
          curl -sSL https://github.com/prometheus/prometheus/releases/download/v2.54.1/prometheus-2.54.1.linux-amd64.tar.gz \
            | tar xz --strip-components=1 prometheus-2.54.1.linux-amd64/promtool
          ./promtool check rules monitoring/prometheus/rules/*.yml
          for f in monitoring/grafana/dashboards/*.json; do jq empty "$f" && echo "valid JSON: $f"; done

      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile
          failure-threshold: error

      - name: Shell and PHP syntax
        run: |
          shellcheck docker/entrypoint.sh tests/smoke.sh tests/integration.sh
          php -l docker/settings.php
          php -l docker/health.php

      - name: Validate Kubernetes manifests
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          for overlay in local eks; do
            kubectl kustomize "k8s/overlays/$overlay" | ./kubeconform -strict -summary -ignore-missing-schemas
          done

  # ---------------------------------------------------------------- 2. Unit tests
  unit-tests:
    name: Unit tests (PHPUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
      - name: Install PHPUnit
        run: composer install --working-dir=tests --no-interaction --prefer-dist
      - name: Run unit tests
        run: tests/vendor/bin/phpunit -c tests/phpunit.xml

  # ---------------------------------------------------------------- 3. Build + integration tests
  build-and-test:
    name: Build image and run integration tests
    runs-on: ubuntu-latest
    needs: [validate, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack (Docker Compose)
        run: docker compose up -d --build --wait --wait-timeout 600

      - name: Smoke tests against the container
        run: bash tests/smoke.sh http://localhost:8080

      - name: Integration tests
        run: bash tests/integration.sh

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------- 4. Publish the image
  publish-image:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------- 5. Staging (automatic)
  deploy-staging:
    name: Deploy to staging and smoke test
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    environment:
      name: staging
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Roll out new servers and smoke test
        uses: ./.github/actions/deploy-asg
        with:
          role-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          region: ${{ env.AWS_REGION }}
          asg-name: ${{ vars.STAGING_ASG_NAME || 'drupal-ha-staging-asg' }}
          alb-name: ${{ vars.STAGING_ALB_NAME || 'drupal-ha-staging-alb' }}

  # ---------------------------------------------------------------- 6. Production (manual approval)
  deploy-production:
    name: Deploy to production (needs approval)
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # The "production" environment has required reviewers: the job pauses until someone approves.
    environment:
      name: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check that a production stack is configured
        id: cfg
        run: |
          if [ -n "${{ vars.PRODUCTION_ASG_NAME }}" ] && [ -n "${{ vars.PRODUCTION_ALB_NAME }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No production stack configured (set PRODUCTION_ASG_NAME and PRODUCTION_ALB_NAME). Approval step demonstrated only."
          fi
      - name: Roll out new servers and smoke test
        if: steps.cfg.outputs.enabled == 'true'
        uses: ./.github/actions/deploy-asg
        with:
          role-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          region: ${{ env.AWS_REGION }}
          asg-name: ${{ vars.PRODUCTION_ASG_NAME }}
          alb-name: ${{ vars.PRODUCTION_ALB_NAME }}
