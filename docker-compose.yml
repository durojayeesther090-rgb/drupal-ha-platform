# Local development and testing:  docker compose up --build
# Then open http://localhost:8080  (login: admin / the DRUPAL_ADMIN_PASSWORD below)
services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: drupal
      MARIADB_USER: drupal
      MARIADB_PASSWORD: ${DB_PASSWORD:-drupalpass}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  drupal:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: drupal-ha:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: drupal
      DB_USER: drupal
      DB_PASSWORD: ${DB_PASSWORD:-drupalpass}
      HASH_SALT: ${HASH_SALT:-local-only-salt-change-me}
      TRUSTED_HOST_PATTERN: "^.+$$"
      DRUPAL_AUTO_INSTALL: "true"
      DRUPAL_ADMIN_PASSWORD: ${DRUPAL_ADMIN_PASSWORD:-ChangeMe123}
      DRUPAL_SITE_NAME: "Drupal HA Platform (local)"
    volumes:
      - drupal_files:/opt/drupal/web/sites/default/files
      - drupal_private:/var/www/private

volumes:
  db_data:
  drupal_files:
  drupal_private:
