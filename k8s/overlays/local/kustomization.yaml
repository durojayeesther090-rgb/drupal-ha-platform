apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: drupal
resources:
  - namespace.yaml
  - ../../base
  - mariadb.yaml
generatorOptions:
  disableNameSuffixHash: true
# Throw-away passwords for a local test cluster only. Never reuse them on AWS.
secretGenerator:
  - name: drupal-secrets
    literals:
      - DB_PASSWORD=localdrupalpass
      - DB_ROOT_PASSWORD=localrootpass
      - HASH_SALT=local-only-salt-change-me-0000000000000000000000000000
      - DRUPAL_ADMIN_PASSWORD=ChangeMe123
patches:
  - path: pvc-rwo.yaml
